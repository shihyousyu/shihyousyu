name: Update README Stats Card

on:
    schedule:
        - cron: "0 16 * * *"
    workflow_dispatch:

permissions: 
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Chectout
              uses: actions/checkout@v6

            - name: Generate activaty graph
              uses: maurodesouza/github-readme-activity-graph-action@v1
              with:
                  username: shihyousyu
                  options: hide_border=true&theme=github-compact&area=true&area_color=A6FFA6&custom_title=Syu's%20Activity%20Graph
                  output_path: dist/activity-graph.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate stat card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                card: stats
                options: username=shihyousyu&theme=transparent&hide_border=True&text_color=FFFFFF&title_color=FFFFFF&rank_icon=github
                path: dist/stats.svg
                token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Generate top languages card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                card: top-langs
                options: username=shihyousyu&theme=transparent&hide_border=true&langs_count=10&text_color=FFFFFF&title_color=FFFFFF&layout=compact
                path: dist/top-langs.svg
                token: ${{  secrets.GITHUB_TOKEN }}

            - name: Generate streak stat card
              uses: DenverCoder1/github-readme-streak-stats@v1
              with: 
                options: user=shihyousyu&theme=transparent&mode=weekly&fire=FFFFFF&currStreakNum=FFFFFF&sideLabels=FFFFFF&sideNums=FFFFFF&ring=FFFFFF&currStreakLabel=FFFFFF&dates=FFFFFF&hide_border=true
                path: dist/streak-stat.svg
                token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                name: stats-cards
                path: dist/*.svg
                retention-days: 1

    deploy:
        runs-on: ubuntu-latest
        needs: generate

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v7
              with:
                name: stats-cards
                path: dist

            - name: Publish activity graph SVG
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
